# ================================================
# DEV Profile
# ================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# === JWT ===
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24h
  refresh-expiration: 604800000 # 7 days

# === EMAIL (Gmail SMTP - DEV) ===
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        starttls.required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

# === VNPay (SANDBOX) ===
vnpay:
  version: 2.1.0
  command: pay
  order-type: other
  tmn-code: ${VNPAY_TMN_CODE}
  hash-secret: ${VNPAY_HASH_SECRET}
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:8080/api/payments/vnpay/return
  ipn-url: http://localhost:8080/api/payments/vnpay/ipn
  frontend-return-url: http://localhost:5173/payment/vnpay/return

# === Server ===
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.restaurant: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
