openapi: 3.0.0
info:
  title: Restaurant Management API - v2
  description: API phục vụ cho Website quản lý nhà hàng (Login, Menu, Reservation, Order, Report)
  version: 2.0.0

servers:
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: Authentication
    description: Đăng nhập, Đăng ký, Quên & Đổi mật khẩu
  - name: Menu
    description: Quản lý danh sách món ăn (CRUD)
  - name: Reservation
    description: Đặt bàn (Dành cho khách và nhân viên)
  - name: Order
    description: Mở bàn và gọi món
  - name: Report
    description: Báo cáo thống kê doanh thu

paths:
  # --- AUTHENTICATION ---
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản nhân viên mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "201":
          description: Tạo tài khoản thành công

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập hệ thống
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Đăng nhập thành công, trả về JWT Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"

  /api/auth/change-password:
    put:
      tags: [Authentication]
      summary: Đổi mật khẩu
      responses:
        "200":
          description: Đổi mật khẩu thành công

  /api/auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Yêu cầu mã reset mật khẩu qua Email
      responses:
        "200":
          description: Đã gửi email hướng dẫn

  # --- MENU CRUD ---
  /api/menu:
    get:
      tags: [Menu]
      summary: Lấy danh sách món ăn
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
    post:
      tags: [Menu]
      summary: Thêm món ăn mới (Admin/Manager)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItem"
      responses:
        "201":
          description: Tạo thành công

  /api/menu/{id}:
    put:
      tags: [Menu]
      summary: Cập nhật thông tin món ăn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cập nhật thành công
    delete:
      tags: [Menu]
      summary: Xóa món ăn
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Đã xóa

  # --- RESERVATIONS ---
  /api/reservations:
    post:
      tags: [Reservation]
      summary: Khách hàng đặt bàn (Online hoặc tại quầy)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reservation"
      responses:
        "201":
          description: Đặt bàn thành công

  # --- ORDERS ---
  /api/orders:
    post:
      tags: [Order]
      summary: Mở một Order mới tại bàn
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                table_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Order đã được mở

  /api/orders/{id}/items:
    post:
      tags: [Order]
      summary: Thêm món vào Order (Gọi món)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
      responses:
        "200":
          description: Đã thêm món thành công

  # --- REPORTS ---
  /api/reports/revenue:
    get:
      tags: [Report]
      summary: Báo cáo doanh thu theo tháng
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Kết quả báo cáo
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_revenue:
                    type: number
                  order_count:
                    type: integer

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string }
        role:
          {
            type: string,
            enum: [admin, manager, waiter, cashier, kitchen_staff],
          }
        status: { type: string }

    UserRegister:
      type: object
      required: [full_name, email, password]
      properties:
        full_name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: string }

    MenuItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        status: { type: string, enum: [available, out_of_stock, hidden] }
        image_url: { type: string }

    Reservation:
      type: object
      properties:
        customer_name: { type: string }
        customer_phone: { type: string }
        party_size: { type: integer }
        reserved_at: { type: string, format: date-time }
        note: { type: string }

    OrderItem:
      type: object
      properties:
        item_id: { type: string, format: uuid }
        quantity: { type: integer, default: 1 }
        note: { type: string }
